name: Send trend report to Discord

on:
  push:
    branches: [main]
    paths: ["reports/*/data.json"]
  workflow_dispatch:
    inputs:
      date:
        description: "Report folder to send (e.g. 2026-11-01), empty = latest"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - name: Render and send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(ls -d reports/*/ | xargs -n1 basename | sort | tail -1); fi
          python scripts/render_pdf.py "reports/$DATE/data.json"
          python scripts/send_discord.py "reports/$DATE/data.json"
      - uses: actions/upload-artifact@v4
        with:
          name: trend-brief
          path: reports/*/trend-brief-*.pdf
